<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniverseDIU - Post Composer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen py-10 px-4">

  <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200/80 shadow-xl overflow-hidden">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-lg font-bold text-slate-900">Create a Post</h2>
      <a href="2-home-feed.html" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors">
        ✕
      </a>
    </div>

    <!-- Content -->
    <div class="p-6 md:p-8 space-y-6">
      <!-- Tabs -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Contribution Type</label>
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
          <button class="flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-blue-600 bg-blue-50/70 text-blue-700 font-semibold text-xs">
            <svg class="w-5 h-5 mb-1 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span>Knowledge</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 text-slate-600 hover:text-slate-900 font-semibold text-xs">
            <svg class="w-5 h-5 mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            <span>Resource</span>
          </button>
          <a href="9-ask-question.html" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 text-slate-600 hover:text-slate-900 font-semibold text-xs">
            <svg class="w-5 h-5 mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>Question</span>
          </a>
          <button class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 text-slate-600 hover:text-slate-900 font-semibold text-xs">
            <svg class="w-5 h-5 mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
            <span>Project</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 text-slate-600 hover:text-slate-900 font-semibold text-xs">
            <svg class="w-5 h-5 mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            <span>Link</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 text-slate-600 hover:text-slate-900 font-semibold text-xs">
            <svg class="w-5 h-5 mb-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span>Media</span>
          </button>
        </div>
      </div>

      <p class="text-xs text-slate-500 italic">Share your knowledge, explanation, tutorial or idea...</p>

      <!-- Editor -->
      <div class="border border-slate-200 rounded-2xl overflow-hidden">
        <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 flex items-center gap-1.5 text-slate-600 text-xs font-semibold">
          <button class="p-1.5 rounded hover:bg-slate-200 font-bold">B</button>
          <button class="p-1.5 rounded hover:bg-slate-200 italic">I</button>
          <button class="p-1.5 rounded hover:bg-slate-200 line-through">S</button>
          <span class="w-px h-4 bg-slate-300 mx-1"></span>
          <button class="p-1.5 rounded hover:bg-slate-200 font-mono text-[11px]">&lt;/&gt;</button>
          <button class="p-1.5 rounded hover:bg-slate-200">• List</button>
          <button class="p-1.5 rounded hover:bg-slate-200">1. List</button>
          <button class="p-1.5 rounded hover:bg-slate-200">🔗 Link</button>
        </div>
        <textarea rows="5" class="w-full p-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none resize-none" placeholder="Write your knowledge post, insights or tutorial here..."></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Department</label>
          <select class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-800">
            <option selected>Software Engineering</option>
            <option>Computer Science & Engineering</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Course</label>
          <select class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-800">
            <option selected>SE-322</option>
            <option>SE-213</option>
            <option>CSE-311</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Topic</label>
        <input type="text" value="React CRUD with Express & MySQL" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-800" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Tags</label>
        <div class="flex flex-wrap items-center gap-2 p-2.5 rounded-xl border border-slate-200 bg-white">
          <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">React ×</span>
          <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">Express ×</span>
          <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">MySQL ×</span>
          <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">CRUD ×</span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Attach File (optional)</label>
        <input type="file" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <a href="2-home-feed.html" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-semibold">Cancel</a>
        <a href="2-home-feed.html" class="px-7 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md">Publish</a>
      </div>
    </div>
  </div>

</body>
</html>
