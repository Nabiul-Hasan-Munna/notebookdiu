<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniverseDIU - Ask a Question</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen py-8 px-4">

  <div class="max-w-3xl mx-auto space-y-4">
    <div class="mb-2">
      <a href="2-home-feed.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-blue-600">
        ← Back
      </a>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 md:p-8 shadow-sm space-y-6">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Ask a Question</h1>
        <p class="text-xs text-slate-500 mt-1">Get help from your fellow DIU students & course seniors</p>
      </div>

      <form action="2-home-feed.html" method="GET" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">What's your question?</label>
          <input type="text" 
                 value="How does JWT authentication actually work in Express?" 
                 class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-xs text-slate-800 transition-all outline-none font-semibold" required />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Provide details or code snippet</label>
          <textarea rows="5" class="w-full p-4 rounded-xl border border-slate-200 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-xs text-slate-800 transition-all outline-none resize-none font-mono" placeholder="Explain what you are trying to achieve, what error you received, or paste relevant code..."></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Department</label>
            <select class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-800">
              <option selected>Software Engineering</option>
              <option>Computer Science & Engineering</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Course</label>
            <select class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-800">
              <option selected>SE-322</option>
              <option>SE-213</option>
              <option>CSE-311</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Tags</label>
          <div class="flex flex-wrap items-center gap-2">
            <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">#JWT</span>
            <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">#Express</span>
            <span class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-semibold">#Node.js</span>
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md shadow-blue-500/20 text-xs transition-all">
          Post Question
        </button>
      </form>
    </div>
  </div>

</body>
</html>
